name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Testcontainers requires Docker, which is pre-installed on ubuntu-latest runners.
    # We do NOT use a static Postgres service here, because integration.test.js 
    # dynamically spins up a fresh container using @testcontainers/postgresql.

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: 'backend/package-lock.json'

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Run Integration Tests
      working-directory: ./backend
      run: npm test
